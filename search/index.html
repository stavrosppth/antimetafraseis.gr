<!DOCTYPE html>
<html lang="el" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Αναζήτηση — Αντιμεταφράσεις</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    /* Apply saved theme before page renders to avoid a flash of wrong colours */
    (function() {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header>
    <nav>
      <a class="site-title" href="/">Αντιμεταφράσεις</a>

      <form class="nav-search" action="/search/" method="get" role="search">
        <input type="search" name="q" placeholder="Αναζήτηση…"
               value="" aria-label="Αναζήτηση ποιημάτων" />
        <button type="submit">🔍</button>
      </form>

      <ul>
        <li><a href="/poems/">Ποιήματα</a></li>
        <li><a href="/poets/">Ποιητές</a></li>
        <li><a href="/about/">Σχετικά</a></li>
        <li>
          <button class="theme-toggle" id="theme-toggle" aria-label="Εναλλαγή σκοτεινής λειτουργίας">🌙</button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    
<h1 class="search-heading">Αποτελέσματα αναζήτησης</h1>

<p class="search-meta" id="search-meta"></p>
<ul class="poem-list" id="search-results"></ul>
<p class="no-results" id="no-results" hidden>Δοκιμάστε διαφορετικές λέξεις-κλειδιά.</p>

<p class="back-link"><a href="/poems/">← Όλα τα ποιήματα</a></p>

<script>
  /* The search runs in the browser: the list below holds every published poem,
     and is filtered by the ?q= in the address bar. Accents and case are ignored. */
  var SEARCH_INDEX = [{"poet": "Nicanor Parra", "poet_url": "/poet/3/", "title_es": "DEBAJO DE MI CAMA", "title_gr": "\u039a\u0391\u03a4\u03a9 \u0391\u03a0\u0027 \u03a4\u039f \u039a\u03a1\u0395\u0392\u0391\u03a4\u0399 \u039c\u039f\u03a5", "url": "/poem/4/"}, {"poet": "Octavio Paz", "poet_url": "/poet/4/", "title_es": "Aqu\u00ed", "title_gr": "\u0395\u03b4\u03ce", "url": "/poem/5/"}, {"poet": "Octavio Paz", "poet_url": "/poet/4/", "title_es": "Efectos del bautismo", "title_gr": "\u03a4\u03b1 \u03b1\u03c0\u03bf\u03c4\u03b5\u03bb\u03ad\u03c3\u03bc\u03b1\u03c4\u03b1 \u03c4\u03b7\u03c2 \u03b2\u03ac\u03c6\u03c4\u03b9\u03c3\u03b7\u03c2", "url": "/poem/3/"}];

  (function () {
    function norm(s) {
      return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    }
    function el(tag, text, cls) {
      var e = document.createElement(tag);
      if (text) e.textContent = text;
      if (cls) e.className = cls;
      return e;
    }

    var q = (new URLSearchParams(window.location.search).get("q") || "").trim();
    var box = document.querySelector('.nav-search input[name="q"]');
    if (box) box.value = q;
    if (q) document.title = "Αναζήτηση: " + q + " — Αντιμεταφράσεις";

    var meta = document.getElementById("search-meta");
    var list = document.getElementById("search-results");
    var none = document.getElementById("no-results");
    if (!q) return;

    var nq = norm(q);
    var results = SEARCH_INDEX.filter(function (p) {
      return norm(p.title_es).indexOf(nq) !== -1 ||
             norm(p.title_gr).indexOf(nq) !== -1 ||
             norm(p.poet).indexOf(nq) !== -1;
    });

    var strong = el("strong", q);
    if (results.length) {
      meta.append(results.length + (results.length === 1 ? " αποτέλεσμα" : " αποτελέσματα") + " για «", strong, "»");
    } else {
      meta.append("Κανένα αποτέλεσμα για «", strong, "»");
      none.hidden = false;
    }

    results.forEach(function (p) {
      var li = el("li");
      var a = el("a", p.title_gr); a.href = p.url;
      var sub = el("span", p.title_es, "subtitle");
      var poet = el("span", null, "poet-link");
      var pa = el("a", p.poet); pa.href = p.poet_url;
      poet.append("— ", pa);
      li.append(a, " ", sub, " ", poet);
      list.append(li);
    });
  })();
</script>

  </main>

  <footer>
    <p>Αντιμεταφράσεις ισπανόφωνης (και όχι μόνο) ποίησης στα ελληνικά.</p>
  </footer>

  <script>
    var toggle = document.getElementById('theme-toggle');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      toggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', theme);
    }

    // Set correct icon on page load — respect OS preference if no manual choice saved
    var saved = localStorage.getItem('theme');
    var initial = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(initial);

    toggle.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
